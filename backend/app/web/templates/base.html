<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "Crazynet Device Backup" }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <header class="bg-white border-b">
      <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="font-semibold">Crazynet Device Backup</div>
        <nav class="flex gap-4 text-sm">
          <a class="hover:underline" href="/dashboard">Dashboard</a>
          <a class="hover:underline" href="/devices">Devices</a>
          <a class="hover:underline" href="/schedules">Schedules</a>
          <a class="hover:underline" href="/history">History</a>
          <button id="logoutBtn" class="text-red-600 hover:underline">Logout</button>
        </nav>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6">
      {% block content %}{% endblock %}
    </main>

    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
