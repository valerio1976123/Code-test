{% extends "base.html" %}
{% block content %}
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold">History</h1>
    <button id="refreshHistory" class="text-sm underline">Refresh</button>
  </div>

  <div class="bg-white border rounded-lg p-4 mt-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <div>
        <label class="block text-sm font-medium">Device</label>
        <select id="historyDevice" class="mt-1 w-full border rounded px-3 py-2"></select>
      </div>
      <div>
        <label class="block text-sm font-medium">Status</label>
        <select id="historyStatus" class="mt-1 w-full border rounded px-3 py-2">
          <option value="">(any)</option>
          <option value="queued">queued</option>
          <option value="running">running</option>
          <option value="success">success</option>
          <option value="failed">failed</option>
        </select>
      </div>
      <div class="flex items-end">
        <button id="applyHistory" class="bg-slate-900 text-white rounded px-3 py-2 text-sm">Apply</button>
      </div>
    </div>
  </div>

  <div class="bg-white border rounded-lg p-4 mt-6">
    <div class="overflow-auto">
      <table class="min-w-full text-sm">
        <thead>
          <tr class="text-left text-slate-600">
            <th class="py-2 pr-4">ID</th>
            <th class="py-2 pr-4">Device</th>
            <th class="py-2 pr-4">Status</th>
            <th class="py-2 pr-4">Created</th>
            <th class="py-2 pr-4">Error</th>
            <th class="py-2 pr-4">Actions</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>
{% endblock %}

{% block scripts %}
<script>
  window.CRAZYNET_PAGE = 'history';
</script>
{% endblock %}
