{% extends "base.html" %}
{% block content %}
  <h1 class="text-2xl font-semibold">Dashboard</h1>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
    <div class="bg-white border rounded-lg p-4">
      <div class="text-sm text-slate-600">Devices</div>
      <div class="mt-2 text-sm">Total: <span id="devicesTotal" class="font-semibold">-</span></div>
      <div class="text-sm">Enabled: <span id="devicesEnabled" class="font-semibold">-</span></div>
      <div class="text-sm">Disabled: <span id="devicesDisabled" class="font-semibold">-</span></div>
    </div>
    <div class="bg-white border rounded-lg p-4">
      <div class="text-sm text-slate-600">Executions (24h)</div>
      <div class="mt-2 text-sm">Total: <span id="execTotal" class="font-semibold">-</span></div>
      <div class="text-sm">Success: <span id="execSuccess" class="font-semibold">-</span></div>
      <div class="text-sm">Failed: <span id="execFailed" class="font-semibold">-</span></div>
    </div>
    <div class="bg-white border rounded-lg p-4">
      <div class="text-sm text-slate-600">Quick actions</div>
      <div class="mt-3 flex gap-2">
        <a class="bg-slate-900 text-white rounded px-3 py-2 text-sm" href="/devices">Manage devices</a>
        <a class="bg-white border rounded px-3 py-2 text-sm" href="/history">View history</a>
      </div>
    </div>
  </div>

  <div class="bg-white border rounded-lg p-4 mt-6">
    <div class="flex items-center justify-between">
      <h2 class="font-semibold">Recent executions</h2>
      <button id="refreshDashboard" class="text-sm underline">Refresh</button>
    </div>
    <div class="overflow-auto mt-3">
      <table class="min-w-full text-sm">
        <thead>
          <tr class="text-left text-slate-600">
            <th class="py-2 pr-4">ID</th>
            <th class="py-2 pr-4">Device</th>
            <th class="py-2 pr-4">Status</th>
            <th class="py-2 pr-4">Created</th>
          </tr>
        </thead>
        <tbody id="recentBody"></tbody>
      </table>
    </div>
  </div>
{% endblock %}

{% block scripts %}
<script>
  window.CRAZYNET_PAGE = 'dashboard';
</script>
{% endblock %}
